services:
  - type: web
    name: find-it-usiu
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd backend && bash build.sh
    startCommand: cd backend && gunicorn find_it_usiu.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.ifzinyigspogaganqobl
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: SUPABASE_STORAGE_REQUIRED
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
